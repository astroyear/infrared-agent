services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: infrared
      POSTGRES_USER: infrared
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrared -d infrared"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://infrared:${POSTGRES_PASSWORD}@db:5432/infrared
      STORAGE_ROOT: /app/storage
    volumes:
      - app_storage:/app/storage
      - ./RTDETR-main-code/pwl_rtdetr:/app/RTDETR-main-code/pwl_rtdetr:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready',timeout=4)"]
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pg_data:
  app_storage:
